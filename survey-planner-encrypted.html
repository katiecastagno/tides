const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'ccs_unlock_' + P.salt.slice(0, 12);
const $ = id => document.getElementById(id);
async function decrypt(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct)));
}
async function derive(pw) {

function show(html) { document.open(); document.write(html); document.close(); }

const ready = new Promise(r => document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r());
(async () => {
  await ready;

$('f').addEventListener('submit', async e => {

    const html = await decrypt(raw);
