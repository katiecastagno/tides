const KEY = 'ccs_unlock_' + P.salt.slice(0, 12);
const $ = id => document.getElementById(id);
async function decrypt(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct)));
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256));
}
function show(html) { document.open(); document.write(html); document.close(); }

const ready = new Promise(r => document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r());
(async () => {
  await ready;
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) { }
  if (saved) { try { show(await decrypt(b64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (_) { } } }

$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('msg').style.color = '#5d6b78'; $('msg').textContent = 'Unlocking…';
  try {
    const raw = await derive($('pw').value);
    const html = await decrypt(raw);
